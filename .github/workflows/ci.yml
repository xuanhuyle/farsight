# ADR-013: boundary contracts run in CI from the first commit, because boundary erosion is the
# modular monolith's characteristic death mode.
# ADR-006: Windows and Linux both, from week 1 -- development is on Windows and deployment is
# in a Linux container, and per-platform golden hashes only work if both are exercised early.
name: ci

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # ADR-014: the GMAT/Basilisk intersection ceiling
      - run: python -m pip install -e ".[dev]"
      - name: unit tests
        run: python -m pytest tests/unit -q
      - name: import boundaries
        run: lint-imports
      - name: lint
        # The rule set is pinned in `[tool.ruff.lint]` and the ruff version in the `dev` extra,
        # so this job checks what the repository decided rather than what the tool currently
        # defaults to. Without both pins the build would start failing on ruff's release
        # schedule -- the same shape as ADR-006's warning about base-image updates forcing a
        # re-golding cycle on someone else's schedule.
        run: ruff check src tests
      - name: console script resolves
        # ADR-024: command names and exit codes are printed into shipped evidence packages, so
        # the entry point is part of the contract. `pyproject.toml` declared
        # `farsight = "farsight.cli.main:app"` against a module that did not exist for weeks; the
        # installed script raised ModuleNotFoundError and nothing noticed, because CI ran pytest
        # and lint-imports and never invoked the command it ships.
        run: |
          farsight --version
          farsight --exit-codes

  no-network:
    # ADR-012: the truth loop makes zero network calls, ever. Proven by running the suite with
    # sockets disabled rather than by asserting it in prose.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/unit -q --disable-socket

  spice:
    # ADR-014: spiceypy is an EXTRA. The `test` job above deliberately does NOT install it, which
    # is what keeps the auditor's zero-extras path exercised -- three records call that property
    # the most commercially important one in the codebase, and it is only real if CI proves the
    # base install works without the extra. This job is the other half: the SPICE-dependent tests
    # skip in `test` and would otherwise never run anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,spice]"
      - name: spice adapter tests
        run: python -m pytest tests/unit -q
      - name: boundaries still hold with spiceypy installed
        # `geometry_is_not_an_engine` can only be violated once spiceypy is importable, so this
        # is the leg where that contract does real work.
        run: lint-imports
      - name: the geometry command runs end to end on Linux
        # The weeks 1-2 exit gate as an INVOCATION, not only as a test import. The console-script
        # lesson one job up applies here too: `run_geometry` being green in pytest says nothing
        # about `farsight geometry` being wired into the Typer app, and that wiring is what ships.
        #
        # The hashes are PRINTED, not asserted equal to the Windows run, and that is deliberate.
        # ADR-006 forecloses the claim an assertion here would imply: "We can never claim bitwise
        # reproducibility across operating systems, so a Windows-only customer is permanently a
        # Tier-B customer and must be told so." Tier A is defined by container digest and CPU ISA
        # feature set, and that record keeps a separate golden tree per platform. A Linux/Windows
        # difference in these hashes is a Tier-B finding, not a gate failure.
        #
        # What IS asserted is that the shipped console script runs the whole path on Linux and
        # exits 0. The printed hashes are for a human comparing two logs, which is all the record
        # permits until ADR-019's container exists.
        run: |
          python - <<'EOF'
          import json, subprocess, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "tests")
          sys.path.insert(0, "tests/unit")
          from test_geometry_gate import _bundle_dict, _populate_cache
          home = Path(tempfile.mkdtemp())
          lsk, spk, ls, ss = _populate_cache(home)
          design = Path(tempfile.mkdtemp()) / "design.json"
          design.write_text(json.dumps(_bundle_dict(lsk, spk, ls, ss), indent=2))
          out = Path(tempfile.mkdtemp())
          r = subprocess.run(["farsight", "--json", "geometry", "--design", str(design),
                              "--out", str(out), "--home", str(home)],
                             capture_output=True, text=True)
          print(r.stdout, r.stderr)
          assert r.returncode == 0, f"exit {r.returncode}"
          summary = json.loads(r.stdout)
          print("LINUX CHANNEL HASHES")
          for line in summary["channels"]:
              print("  ", line)
          EOF

  container:
    # ADR-019's reference image, built and MEASURED. This job exists because the image cannot be
    # built on every developer machine -- the host this was written on has Intel VT-x disabled in
    # firmware, so no container runtime starts there at all -- while a GitHub runner has Docker.
    # The definition-level checks live in `tests/unit/test_container.py` and run everywhere; this
    # job is the part that needs a running image, and it is the only place the weeks 1-2 gate's
    # "bitwise-reproducible in container" wording can actually be demonstrated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build the reference image
        # `build.sh` refuses a FROM line with no @sha256:, so a tag-pinned base fails here rather
        # than producing an image nobody can obtain again.
        run: ./container/build.sh
        env:
          FARSIGHT_IMAGE: farsight-reference
          FARSIGHT_TAG: ci

      - name: is the predicate STABLE across two independent builds?
        # THE QUESTION THAT DECIDES WHETHER THE PREDICATE CAN BE PINNED AT ALL.
        #
        # Two runs of this workflow ten minutes apart produced DIFFERENT predicates
        # (464c495d... then 448787d9...). There is no uv.lock, so nothing pins the dependency set
        # and a rebuild may resolve different wheels -- which would move the predicate for a
        # reason that is not an environment change, and make every Tier-A refusal meaningless.
        #
        # `--no-cache` on the second build is what makes this a test of RESOLUTION rather than of
        # layer caching: with the cache, the install layer is reused and the answer is trivially
        # yes while telling us nothing.
        run: |
          FARSIGHT_TAG=ci2 FARSIGHT_FINGERPRINT=fingerprint2.json           FARSIGHT_BUILD_ARGS=--no-cache ./container/build.sh > build2.log 2>&1 || {
            tail -30 build2.log; exit 1; }
          SECOND=$(grep -oP 'numeric_environment_hash: \K[0-9a-f]{64}' build2.log)
          echo "build 1: $FARSIGHT_PREDICATE"
          echo "build 2: $SECOND"
          if [ "$FARSIGHT_PREDICATE" = "$SECOND" ]; then
            echo "STABLE across two independent builds -- the predicate is pinnable."
          else
            echo "UNSTABLE: two builds of the same source produced different predicates."
            echo "This is a finding, not a flake: it means the Tier-A predicate cannot be pinned"
            echo "until the dependency set is (no uv.lock -- see DEV-24 and container/digests.json)."
            diff <(python -m json.tool fingerprint.json) <(python -m json.tool fingerprint2.json) || true
          fi
        continue-on-error: true

      - name: measure the Tier-A predicate
        # ADR-019 decision 2: every field measured from inside the running worker, after the
        # numeric stack has imported -- which includes forcing the engine import, because the
        # SPICE adapter loads spiceypy lazily and CSPICE would otherwise not be mapped.
        run: |
          echo "numeric_environment_hash = $FARSIGHT_PREDICATE"
          python -m json.tool fingerprint.json

      - name: does the build match the RECORDED predicate?
        # This is what makes container/digests.json a control rather than a note. Until now it
        # recorded a value nothing compared against.
        #
        # A mismatch FAILS. That is the point of a predicate: ADR-019 decision 5 already gives
        # base-image changes "a named owner and a mechanical decision rule" plus a monthly refresh
        # job, so a moved predicate is a re-golding decision somebody makes, not a number that
        # drifts while every Tier-A claim quietly keeps asserting the old one.
        run: |
          RECORDED=$(python -c "import json;print(json.load(open('container/digests.json'))['numeric_environment_hash'] or '')")
          echo "recorded: $RECORDED"
          echo "measured: $FARSIGHT_PREDICATE"
          if [ -z "$RECORDED" ]; then
            echo "digests.json records no predicate; nothing to enforce yet."
          elif [ "$RECORDED" = "$FARSIGHT_PREDICATE" ]; then
            echo "MATCH -- the image is the one container/digests.json describes."
          else
            echo "MISMATCH. The reference environment changed."
            echo "This is a re-golding decision (ADR-019 decision 5), not a number to overwrite:"
            echo "read the diff, decide whether the change was intended, then update digests.json."
            diff <(python -m json.tool fingerprint.json) <(python -m json.tool fingerprint2.json) || true
            exit 1
          fi

      - name: the gate, twice, inside the image
        # THE EXIT GATE'S OWN WORDING. Two runs of one frozen design in the container must produce
        # identical channel hashes. The synthetic-SPK design is used because it needs no download;
        # the real-Psyche leg needs 46 MiB of kernels this job does not fetch.
        run: |
          # podman does not create a bind-mount source directory; docker does. Creating it here
          # rather than relying on the runtime is one less thing that differs between builders.
          mkdir -p out
          $FARSIGHT_BUILDER run --rm -v "$PWD/out:/out" farsight-reference:ci python - <<'EOF'
          import json, sys, tempfile
          from pathlib import Path
          sys.path[:0] = ["tests", "tests/unit"]
          from test_geometry_gate import _bundle_dict, _populate_cache
          home = Path(tempfile.mkdtemp())
          lsk, spk, ls, ss = _populate_cache(home)
          design = Path(tempfile.mkdtemp()) / "run.json"
          design.write_text(json.dumps(_bundle_dict(lsk, spk, ls, ss), indent=2))
          from farsight.cli.run_geometry import run_geometry
          a = run_geometry(design_path=design, out_dir=Path(tempfile.mkdtemp()), home=home,
                           ts_utc="2026-09-07T12:00:00+00:00")
          b = run_geometry(design_path=design, out_dir=Path(tempfile.mkdtemp()), home=home,
                           ts_utc="2026-09-07T12:00:00+00:00")
          assert a["channels"] == b["channels"], "NOT bitwise reproducible in the container"
          assert a["spec_hash"] == b["spec_hash"]
          Path("/out/channels.json").write_text(json.dumps(a["channels"], indent=2))
          print("bitwise reproducible in container:")
          for line in a["channels"]:
              print("  ", line)
          EOF

      - name: the full suite inside the image
        run: $FARSIGHT_BUILDER run --rm farsight-reference:ci python -m pytest tests/unit -q

      - uses: actions/upload-artifact@v4
        with:
          name: numeric-environment-fingerprint
          path: |
            fingerprint.json
            fingerprint2.json
            apt_versions.txt
            out/channels.json
